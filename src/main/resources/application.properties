spring.application.name=Bai2__Ss17

# Cấu hình H2 Database in-memory
spring.datasource.url=jdbc:h2:mem:restaurantdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Hiển thị câu lệnh SQL trong Console để kiểm chứng Cache Hit/Miss
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (tùy chọn mở web console tại /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
